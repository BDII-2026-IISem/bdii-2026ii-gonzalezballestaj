
<div class="card p-8 w-full self-start m-6 font-normal text-slate-800">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Gestión de Clientes</h2>

        <p-button
            label="Nuevo Cliente"
            icon="pi pi-plus"
            [routerLink]="['/clientes/new']"
            styleClass="p-button-success">
        </p-button>
    </div>

    <p-table
        [value]="(clients$ | async) ?? []"
        [loading]="loading"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
        [rowsPerPageOptions]="[5, 10, 25, 50]"
        dataKey="id"
        styleClass="p-datatable-striped"
        [tableStyle]="{'min-width': '50rem'}">

        <ng-template #header>
            <tr>
                <th pSortableColumn="id">
                    ID <p-sorticon field="id"></p-sorticon>
                </th>

                <th pSortableColumn="name">
                    Nombre <p-sorticon field="name"></p-sorticon>
                </th>

                <th pSortableColumn="documentNumber">
                    Documento <p-sorticon field="documentNumber"></p-sorticon>
                </th>

                <th pSortableColumn="phone">
                    Teléfono <p-sorticon field="phone"></p-sorticon>
                </th>

                <th pSortableColumn="email">
                    Email <p-sorticon field="email"></p-sorticon>
                </th>

                <th pSortableColumn="status">
                    Estado <p-sorticon field="status"></p-sorticon>
                </th>

                <th class="text-center">Acciones</th>
            </tr>
        </ng-template>

        <ng-template #body let-client>
            <tr>
                <td>{{ client.id }}</td>
                <td>{{ client.name }}</td>
                <td>{{ client.documentType }} {{ client.documentNumber }}</td>
                <td>{{ client.phone || '—' }}</td>
                <td>{{ client.email || '—' }}</td>
                <td>
                    <p-tag
                        [value]="client.status === 'active' ? 'Activo' : 'Inactivo'"
                        [severity]="client.status === 'active' ? 'success' : 'danger'">
                    </p-tag>
                </td>

                <td class="text-center">
                    <div class="flex justify-center gap-2">
                        <p-button
                            icon="pi pi-pencil"
                            [routerLink]="['/clientes/edit', client.id]"
                            [state]="{ client: client }"
                            styleClass="p-button-rounded p-button-text p-button-warning"
                            pTooltip="Editar"
                            tooltipPosition="top">
                        </p-button>

                        <p-button
                            icon="pi pi-trash"
                            (onClick)="confirmDelete(client)"
                            styleClass="p-button-rounded p-button-text p-button-danger"
                            pTooltip="Eliminar"
                            tooltipPosition="top">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="7" class="text-center p-4">
                    <div class="flex flex-col items-center gap-3">
                        <i class="pi pi-info-circle text-4xl text-gray-400"></i>

                        <span class="text-gray-500">
                            No se encontraron clientes
                        </span>

                        <p-button
                            label="Crear Primer Cliente"
                            icon="pi pi-plus"
                            [routerLink]="['/clientes/new']"
                            styleClass="p-button-sm p-button-outlined">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog></p-confirmdialog>
<p-toast></p-toast>
