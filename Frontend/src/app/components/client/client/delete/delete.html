
<div class="card p-6 w-full max-w-lg font-normal text-slate-800 self-start mt-6">
  <h2 class="text-2xl font-bold mb-4">Eliminar cliente</h2>

  @if (client) {
    <p class="mb-2">¿Está seguro de que desea eliminar a <strong>{{ client.name }}</strong>?</p>
    <p class="text-gray-500 text-sm mb-6">
      Documento {{ client.documentType }} {{ client.documentNumber }}. El registro quedará con estado inactivo.
    </p>

    <div class="flex justify-end gap-3">
      <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancel()" />
      <p-button label="Sí, eliminar" icon="pi pi-trash" severity="danger" [loading]="loading" (onClick)="confirm()" />
    </div>
  } @else {
    <p class="text-gray-500"><i class="pi pi-spin pi-spinner mr-2"></i>Cargando cliente...</p>
  }
</div>

<p-toast></p-toast>
