<div class="flex min-h-screen flex-col bg-slate-50">

  <app-header
    appName="WayuuTravel"
    (menuRequested)="toggleMenu()"
  />

  <div class="flex flex-1 overflow-hidden">

    @if (menuOpen()) {
      <aside class="w-64 shrink-0">
        <app-aside
          appName="WayuuTravel"
          [items]="menuItems()"
          (navigated)="closeMenu()"
        />
      </aside>
    }

    <main class="min-w-0 flex-1 overflow-y-auto p-4 sm:p-6">
      <router-outlet />
    </main>

  </div>

  <app-footer />

</div>
